<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Tower Horizon Calculator 2.0 data flow</title>
<desc id="desc">GitHub Pages sends tower, terrain and visibility requests to the existing Cloudflare Worker. The Worker serves the existing FCC tower lookup plus USGS EPQS elevation, USGS 3DEP profile and Census address lookup. Outputs include altitude above mean sea level, a terrain path profile and an approximate visibility map.</desc>
<rect width="960" height="480" fill="#e5e7e8"/><rect x="13" y="13" width="934" height="49" fill="#193b58"/>
<text x="30" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">TOWER HORIZON CALCULATOR 2.0</text><text x="817" y="41" fill="#ffe29b" font-family="Arial,sans-serif" font-size="12">ARCHITECTURE</text>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#355b76"/></marker></defs>
