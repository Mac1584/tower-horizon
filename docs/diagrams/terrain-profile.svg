<svg xmlns="http://www.w3.org/2000/svg" width="940" height="405" viewBox="0 0 940 405" role="img" aria-labelledby="title desc">
<title id="title">Illustrative transmitter to receiver terrain profile</title>
<desc id="desc">A tall transmitter on the left and a receiver on the right, with a dashed line of sight crossing an intervening ridgeline. Terrain clearance is negative at the obstruction; curvature and atmospheric refraction must be accounted for in actual calculations.</desc>
