name: Tower Horizon 2.0 static smoke check

on:
  push:
    branches:
      - feature/terrain-v2-usgs
      - staging/terrain-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts, HTML wiring and assets
        run: node tests/check-static.mjs
      - name: Reject missing samples in point-to-point multipoint analysis
        run: node tests/check-point-to-point.mjs
      - name: Verify DEM provenance reporting and missing-source fallbacks
        run: node tests/check-terrain-sources.mjs
      - name: Exercise 360-degree PDF generation with simulated terrain data
        run: node tests/check-360-pdf.mjs
      - name: Validate staging-only Worker endpoints and USGS metadata
        run: node tests/check-staging-worker.mjs
      - name: Validate staging terrain URL
        if: github.ref_name == 'staging/terrain-v2'
        run: node tests/check-static.mjs --staging
