<text x="480" y="104" text-anchor="middle" fill="#193b58" font-family="Arial,sans-serif" font-size="17" font-weight="bold">GITHUB PAGES — Browser Interface</text>
<text x="480" y="125" text-anchor="middle" fill="#516371" font-family="Arial,sans-serif" font-size="13">Tower inputs · terrain chart · interactive map</text>
<path d="M480 139V171" stroke="#355b76" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="290" y="181" width="380" height="65" fill="#fff3c1" stroke="#9e945e"/><rect x="290" y="181" width="8" height="65" fill="#356641"/>
<text x="480" y="208" text-anchor="middle" fill="#193b58" font-family="Arial,sans-serif" font-size="18" font-weight="bold">CLOUDFLARE WORKER</text>
<text x="480" y="230" text-anchor="middle" fill="#516371" font-family="Consolas, monospace" font-size="14">tower-data-api.mac1584.workers.dev</text>
<path d="M480 246V266M128 266H832M128 266V291M362 266V291M597 266V291M832 266V291" stroke="#355b76" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="19" y="301" width="218" height="85" fill="#f7f8f9" stroke="#89949d"/>
<rect x="253" y="301" width="218" height="85" fill="#f7f8f9" stroke="#89949d"/>
