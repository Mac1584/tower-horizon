<rect x="722" y="301" width="219" height="85" fill="#f7f8f9" stroke="#89949d"/>
<text x="128" y="331" font-size="16" font-weight="bold" fill="#193b58">FCC / ASR</text><text x="128" y="355" font-size="13" fill="#516371">Existing tower lookup</text><text x="128" y="373" font-size="12" fill="#516371">Retain /tower</text>
<text x="362" y="331" font-size="16" font-weight="bold" fill="#193b58">USGS EPQS</text><text x="362" y="355" font-size="13" fill="#516371">Ground elevation</text><text x="362" y="373" font-size="12" fill="#516371">/terrain/elevation</text>
<text x="597" y="331" font-size="16" font-weight="bold" fill="#193b58">USGS 3DEP</text><text x="597" y="355" font-size="13" fill="#516371">Terrain line samples</text><text x="597" y="373" font-size="12" fill="#516371">/terrain/profile</text>
