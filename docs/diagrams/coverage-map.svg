<svg xmlns="http://www.w3.org/2000/svg" width="940" height="475" viewBox="0 0 940 475" role="img" aria-labelledby="title desc">
<title id="title">Illustrative 360 degree terrain visibility map</title>
<desc id="desc">A circle around a tower location is subdivided into radial sectors. Some green sectors are visible and some red sectors are terrain-blocked. The blue dashed outer circle shows the theoretical radio horizon. This is schematic and not the output of a real USGS computation.</desc>
<rect width="940" height="475" fill="#e6eaed"/><rect x="12" y="12" width="916" height="48" fill="#193b58"/>
<text x="28" y="43" font-size="20" fill="white" font-family="Arial,sans-serif" font-weight="bold">360° TERRAIN VISIBILITY</text><text x="740" y="40" font-size="12" fill="#ffe29b" font-family="Arial,sans-serif">ILLUSTRATIVE MAP</text>
<rect x="20" y="75" width="650" height="378" fill="#e6ede7" stroke="#89949d"/>
<g stroke="#c6d3ca" stroke-width="1.5" fill="none"><path d="M20 124Q134 67 259 122T497 109T670 131"/><path d="M20 152Q133 93 259 151T497 138T670 160"/><path d="M20 296Q117 252 245 302T487 276T670 320"/><path d="M20 327Q117 280 245 331T487 305T670 349"/><path d="M54 75Q38 174 63 262T44 453"/><path d="M616 75Q595 171 631 265T609 453"/></g>
<defs><clipPath id="h"><circle cx="341" cy="268" r="176"/></clipPath></defs>
